name: autobump

on:
  workflow_dispatch:
  schedule:
    - cron: "50 0 * * 5"

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: true

jobs:
  autobump:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        prefix: ["a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m", "n", "o", "p", "q", "r", "s", "t", "u", "v", "w", "x", "y", "z"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: tibdex/github-app-token@v1
        id: generate-token
        with:
          app_id: ${{ secrets.SNAKEDEPLOY_BOT_APP_ID }}
          private_key: ${{ secrets.SNAKEDEPLOY_BOT_PRIVATE_KEY }}

      - name: Update conda envs
        uses: snakemake/snakedeploy-github-action@v1
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          subcommand: update-conda-envs
          # ensure that envs are emudhra-safe (https://discuss.python.org/t/information-for-python-users-regarding-emudhra-emsign-ca-certificate-security-incident/109576) via --ensure
          args: >-
            */${{ matrix.prefix }}*/environment.yaml */${{ matrix.prefix }}*/*/environment.yaml --create-prs --warn-on-error --entity-regex '(?P<entity>.+)/environment.yaml' --pr-add-label --pin-envs
            --ensure "certifi>=2026.10.19" "pip>=26.2.2" "uv>=0.13.4" "sigstore>=4.5.1" "pixi>=0.82.1" "virtualenv>=21.14.12" "conda>=26.9.4"

  autobump_meta:
    strategy:
      fail-fast: false
      max-parallel: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: tibdex/github-app-token@v1
        id: generate-token
        with:
          app_id: ${{ secrets.SNAKEDEPLOY_BOT_APP_ID }}
          private_key: ${{ secrets.SNAKEDEPLOY_BOT_PRIVATE_KEY }}

      - name: Update meta-wrappers
        uses: snakemake/snakedeploy-github-action@v1
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          subcommand: update-snakemake-wrappers
          args: "meta/*/*/meta_wrapper.smk --create-prs --entity-regex '(?P<entity>.+)/meta_wrapper.smk' --pr-add-label --per-snakefile-prs"
