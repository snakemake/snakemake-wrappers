[workspace]
authors = ["Johannes Köster <johannes.koester@uni-due.de>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64"]

[tasks]
test = "pytest -v test_wrappers.py"

[dependencies]
snakemake-minimal = "*"
snakemake-storage-plugin-http = "*"
pytest = ">=9.1.1,<10"
pandas = ">=3.1.0,<4"
conda = ">=26.7.3,<27"
black = ">=26.10.1,<27"
snakefmt = ">=2.1.0,<3"
